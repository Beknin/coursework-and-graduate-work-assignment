version: '3.8'

services:
  backend:
    build: .
    container_name: thesis-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./orders:/app/orders
      - ./database:/app/database
    environment:
      - DATABASE_URL=sqlite:///./database/database.db
    restart: unless-stopped