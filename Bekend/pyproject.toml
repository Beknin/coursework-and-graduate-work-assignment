[tool.poetry]
name = "thesis-backend"
version = "0.1.0"
description = "Backend for thesis distribution system (FastAPI)"
authors = ["Beknin <your-email@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
sqlalchemy = "^2.0.25"
python-docx = "^1.1.0"
openpyxl = "^3.1.2"
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"
